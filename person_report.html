<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你做人能得几分｜做人成绩单</title>
<style>
/* ============ 基础与纸纹 ============ */
:root{
  --paper:#FBF8F2; --mint:#8FD6C0; --red:#F26D6D; --yellow:#FBE7A1;
  --ink:#2B2B2B; --ink-soft:#7a756c; --line:#e7e0d2;
  --hand:"Kaiti SC","STKaiti","KaiTi","楷体","PingFang SC","Microsoft YaHei",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background-color:var(--paper);
  /* 纸张微纹理：双层点阵 */
  background-image:
    radial-gradient(rgba(43,43,43,.028) 1px,transparent 1px),
    radial-gradient(rgba(43,43,43,.018) 1px,transparent 1px);
  background-size:24px 24px,15px 15px;
  background-position:0 0,7px 9px;
  line-height:1.7;
}
button,input{font-family:inherit;touch-action:manipulation}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
body.locked{overflow:hidden}
body.locked #app{visibility:hidden}

/* ============ 通用按钮 / toast / 模态 ============ */
.btn{
  min-height:48px;padding:12px 26px;border-radius:14px;font-size:17px;letter-spacing:1px;
  border:2px solid var(--red);transition:transform .15s ease,box-shadow .15s ease;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 0 rgba(242,109,109,.28)}
.btn-primary:active{box-shadow:0 2px 0 rgba(242,109,109,.28)}
.btn-ghost{background:transparent;color:var(--red)}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:14px;min-height:44px;padding:8px}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:400;
  max-width:min(560px,90vw);background:#fff;border:1.5px dashed var(--red);border-radius:14px;
  padding:14px 20px;font-size:14.5px;line-height:1.8;color:var(--ink);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 10px 30px rgba(43,43,43,.1);
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:350;display:flex;align-items:center;justify-content:center}
.modal.hidden{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(43,43,43,.45)}
.modal-body{
  position:relative;background:var(--paper);border-radius:18px;padding:20px;max-width:92vw;max-height:88dvh;
  overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.modal-body img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:10px auto}
.modal-tip{font-size:14px;color:var(--ink-soft)}

/* ============ 门禁层 ============ */
#gate{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(43,43,43,.03) 1px,transparent 1px);background-size:22px 22px;
  height:100vh;height:100dvh;
}
#gate.off{display:none}
.gate-card{
  width:min(410px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:44px 30px 34px;text-align:center;position:relative;
  box-shadow:0 24px 60px rgba(43,43,43,.1);
}
.gate-card::before{ /* 鹅黄胶带 */
  content:"";position:absolute;top:-14px;left:50%;width:120px;height:30px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(251,231,161,.85);border-radius:3px;box-shadow:0 2px 6px rgba(43,43,43,.08);
}
.lock-icon{width:58px;height:58px;color:var(--red);transition:color .4s}
.lock-icon.ok{color:#5cbfa5}
.gate-title{font-family:var(--hand);font-size:26px;margin:12px 0 4px}
.gate-sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px}
.gate-code{display:flex;gap:12px;justify-content:center;margin-bottom:8px}
.gate-code input{
  width:58px;height:66px;font-size:30px;text-align:center;border:none;outline:none;color:var(--ink);
  border-bottom:3px solid var(--red);background:var(--paper);border-radius:12px 12px 0 0;font-family:var(--hand);
}
.gate-code input:focus{background:#fff;box-shadow:0 6px 14px rgba(242,109,109,.12)}
.gate-err{min-height:22px;font-size:13px;color:var(--red);margin-bottom:10px}
.gate-btn{width:100%;font-size:17px}
.gate-tip{font-size:12px;color:var(--ink-soft);margin-top:14px}

/* ============ 页面容器 ============ */
.page{display:none;min-height:100vh;min-height:100dvh}
.page.active{display:block}
#app{max-width:760px;margin:0 auto;padding:0 20px}

/* ============ 首页 ============ */
#page-home{display:none;position:relative;overflow:hidden}
#page-home.active{display:flex;align-items:center;justify-content:center}
.float-layer{position:absolute;inset:0;pointer-events:none;font-size:34px}
.float-layer span{position:absolute;opacity:.55}
.float-layer span:nth-child(1){left:10%;top:16%}
.float-layer span:nth-child(2){right:12%;top:30%}
.float-layer span:nth-child(3){left:20%;bottom:18%}
.home-inner{text-align:center;position:relative;z-index:1;padding:56px 0 40px;width:100%}
.tape{
  display:inline-block;width:110px;height:26px;background:rgba(143,214,192,.5);
  transform:rotate(-4deg);border-radius:3px;margin-bottom:18px;
}
.home-title{
  font-family:var(--hand);font-weight:700;font-size:clamp(36px,9.5vw,64px);
  letter-spacing:2px;line-height:1.25;
}
.underline-doodle{display:block;width:min(320px,72vw);height:16px;margin:2px auto 0}
.underline-doodle path{stroke:var(--red);stroke-width:4;fill:none;stroke-linecap:round}
.home-sub{margin-top:14px;font-size:14px;letter-spacing:4px;color:var(--ink-soft)}
.home-lead{margin:26px auto 0;max-width:440px;font-size:15px;color:var(--ink);opacity:.85}
.home-btns{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.home-history{margin-top:20px;font-size:13px;color:var(--ink-soft);min-height:20px}
.home-disclaimer{margin-top:26px;font-size:12px;color:var(--ink-soft);opacity:.8}

/* ============ 答题页 ============ */
#page-quiz{display:none;padding:34px 0 60px}
#page-quiz.active{display:block}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-section{
  background:#fff;border:1.5px solid var(--mint);color:#3f8a75;border-radius:999px;
  padding:6px 16px;font-size:14px;white-space:nowrap;
}
.q-count{font-family:var(--hand);font-size:19px;color:var(--ink-soft)}
.q-progress{height:10px;border-radius:6px;background:#efe8da;margin:16px 0 30px;overflow:hidden}
.q-progress i{
  display:block;height:100%;width:0;border-radius:6px;transition:width .4s ease;
  background:linear-gradient(90deg,var(--mint),var(--yellow),var(--red),var(--mint));
  background-size:220% 100%;animation:flow 2.6s linear infinite;
}
@keyframes flow{to{background-position:-220% 0}}
.q-card h2{
  font-family:var(--hand);font-size:clamp(22px,5.6vw,30px);line-height:1.55;
  margin-bottom:26px;min-height:2.9em;
}
.opt{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:60px;
  background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:13px;
  transition:border-color .18s,transform .18s,background .18s;color:var(--ink);
}
.opt:active{transform:scale(.98)}
.opt .abc{
  flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:16px;color:var(--ink-soft);
}
.opt .opt-main{flex:1;font-size:16.5px;line-height:1.5}
.opt.sel{border-color:var(--red);background:#fff7f5;transform:translateX(4px)}
.opt.sel .abc{border-color:var(--red);background:var(--red);color:#fff}
.opt.sel .opt-main{color:var(--red)}
.q-foot{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:8px}
#btn-back-home.hidden{visibility:hidden}

/* ============ 结果页 ============ */
#page-result{padding:0 0 30px}
.r-sec{padding:44px 4px 20px;position:relative}
.r-kicker{text-align:center;font-size:15px;letter-spacing:6px;color:var(--ink-soft);margin-bottom:6px}
.score-stage{position:relative;width:min(460px,88vw);margin:0 auto}
.score-svg{width:100%;display:block}
.s-stroke,.s-fill{
  font-family:var(--hand);font-weight:700;font-size:212px;
}
.s-stroke{fill:none;stroke:var(--red);stroke-width:2.6}
.s-fill{fill:var(--red)}
.pen-tip{position:absolute;top:6%;left:12%;font-size:26px;opacity:0}
.stamp{
  position:absolute;right:-4px;bottom:-6px;width:132px;height:132px;border-radius:50%;
  border:4px solid rgba(242,109,109,.92);color:var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transform:rotate(-14deg);background:rgba(255,255,255,.35);opacity:.92;
}
.stamp::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(242,109,109,.75);border-radius:50%}
.stamp .st1{font-family:var(--hand);font-weight:700;font-size:21px;letter-spacing:2px}
.stamp .st2{font-size:9px;letter-spacing:1px;opacity:.85}
.r-hint{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:26px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.r-lead{text-align:center;font-size:16px;color:var(--ink-soft);max-width:420px;margin:0 auto 18px}
.model{
  text-align:center;font-family:var(--hand);font-weight:700;color:var(--red);
  font-size:clamp(28px,7.4vw,44px);letter-spacing:2px;line-height:1.5;min-height:1.6em;
}
.model .m-ch{display:inline-block;white-space:pre}
.r-title{font-family:var(--hand);font-size:26px;letter-spacing:2px}
.r-sub{font-size:13px;color:var(--ink-soft);margin:4px 0 22px}
.pen-wiggle{display:inline-block;transform-origin:60% 80%;animation:penwig 2.8s ease-in-out infinite}
@keyframes penwig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.r-squiggle{display:block;width:180px;height:12px;margin:0 0 8px}
.r-squiggle path{stroke:var(--red);stroke-width:3.5;fill:none;stroke-linecap:round}
.dim-row{
  padding:13px 4px 15px;border-bottom:1.5px dashed var(--line);cursor:pointer;min-height:44px;
}
.dim-row:first-child{border-top:1.5px dashed var(--line)}
.dim-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.d-emoji{font-size:19px}
.d-name{font-size:16.5px;font-weight:600}
.d-burst{
  background:var(--red);color:#fff;font-size:11.5px;border-radius:999px;padding:2px 9px;letter-spacing:1px;
  box-shadow:0 0 12px rgba(242,109,109,.55);
}
.d-score{margin-left:auto;font-family:var(--hand);font-size:24px;font-weight:700}
.d-score.zero{color:#b9b2a5;font-style:italic;font-size:20px}
.d-zero{font-size:16px}
.d-bar{height:12px;background:#efe8da;border-radius:7px;overflow:visible;position:relative}
.d-fill{display:block;height:100%;border-radius:7px;background:var(--mint);transform-origin:left center;position:relative}
.d-fill.hot{background:var(--red)}
.d-fill.none{background:transparent}
.c-lines .c-line{font-size:16px;line-height:2;margin-bottom:14px}
.c-idx{font-family:var(--hand);font-style:normal;color:var(--red);font-weight:700;margin-right:6px}
.hl{
  font-weight:600;padding:0 .12em;color:var(--ink);
  background-image:linear-gradient(transparent 18%,rgba(251,231,161,.95) 18%,rgba(251,231,161,.95) 94%,transparent 94%);
  background-repeat:no-repeat;background-size:100% 68%;background-position:0 62%;
}
.c-sign{text-align:right;font-size:14px;color:var(--ink-soft);margin-top:6px}
/* 写在最后 · 手写便签 */
#final-note{
  position:relative;margin:38px auto 0;max-width:540px;background:#FFF7DF;border-radius:16px;
  padding:28px 24px 22px;box-shadow:0 10px 26px rgba(43,43,43,.09);
}
#final-note .fn-tape{
  position:absolute;top:-13px;left:50%;width:96px;height:26px;margin-left:-48px;
  background:rgba(143,214,192,.68);border-radius:3px;transform:rotate(-2deg);
}
#final-note .fn-label{font-family:var(--hand);font-size:15px;letter-spacing:3px;color:#3f8a75;margin-bottom:10px}
#final-note .fn-text{font-size:15.5px;line-height:2.05;color:var(--ink)}
#final-note .fn-line{display:block;width:190px;height:12px;margin:14px auto 0}
#final-note .fn-line path{stroke:var(--red);stroke-width:3;fill:none;stroke-linecap:round}
#final-note .fn-mark{position:absolute;right:16px;bottom:12px;font-size:20px}
.end-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.end-note{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:26px}
.balloon-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.balloon-layer span{position:absolute;bottom:-70px;font-size:32px;opacity:.85}

/* ============ 抽屉（维度解释） ============ */
#drawer{position:fixed;left:0;right:0;bottom:0;z-index:320;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.1,.4,1)}
#drawer.open{transform:translateY(0)}
.drawer-mask{position:fixed;inset:0;z-index:315;background:rgba(43,43,43,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer-body{
  background:#fff;border-radius:22px 22px 0 0;padding:24px 24px calc(26px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(43,43,43,.12);
}
.drawer-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.drawer-head .d-emoji{font-size:24px}
.drawer-head h4{font-family:var(--hand);font-size:21px}
.drawer-score{margin-left:auto;font-family:var(--hand);font-size:22px;color:var(--red);font-weight:700}
.drawer-desc{font-size:15px;color:var(--ink);line-height:1.9}
.drawer-close{margin-top:18px;width:100%}

/* ============ 批改序幕 ============ */
#grading{
  position:fixed;inset:0;z-index:300;background:var(--paper);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:6px;
  background-image:radial-gradient(rgba(43,43,43,.03) 1px,transparent 1px);background-size:22px 22px;
}
#grading.show{display:flex}
.grading-pen{font-size:52px;position:relative}
.grading-txt{font-family:var(--hand);font-size:20px;letter-spacing:2px;color:var(--ink-soft)}
.grading-marks{position:absolute;inset:0;pointer-events:none}
.grading-marks span{position:absolute;font-size:30px;font-family:var(--hand);font-weight:700}

/* ============ 动效降级 ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-width:420px){
  .gate-code input{width:52px;height:60px;font-size:26px}
  .stamp{width:112px;height:112px}
  .stamp .st1{font-size:17px}
}
</style>
</head>
<body class="locked">

<!-- ============ 门禁：访问验证 ============ -->
<div id="gate">
  <div class="gate-card" id="gate-card">
    <svg class="lock-icon" viewBox="0 0 64 64" aria-hidden="true">
      <path id="lock-shackle" d="M22 30 v-9 a10 10 0 0 1 20 0 v9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="13" y="30" width="38" height="24" rx="7" fill="none" stroke="currentColor" stroke-width="4.5"/>
      <circle cx="32" cy="41" r="4" fill="currentColor"/>
      <path d="M32 45 v5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h2 class="gate-title">访问验证</h2>
    <p class="gate-sub">做人考场重地，请出示 4 位访问码</p>
    <div class="gate-code" id="gate-code">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="访问码第1位">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="访问码第2位">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="访问码第3位">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="访问码第4位">
    </div>
    <p class="gate-err" id="gate-err"></p>
    <button class="btn btn-primary gate-btn" id="gate-btn">解锁成绩单</button>
    <p class="gate-tip">忘记访问码？去问那位让你来考试的朋友</p>
  </div>
</div>

<!-- ============ 主体（解锁前隐藏，防滚动防查看） ============ -->
<main id="app">

  <!-- 首页 -->
  <section id="page-home" class="page">
    <div class="float-layer" id="float-layer" aria-hidden="true"><span>✏️</span><span>📄</span><span>✨</span></div>
    <div class="home-inner">
      <div class="tape"></div>
      <h1 class="home-title">你做人能得几分？</h1>
      <svg class="underline-doodle" viewBox="0 0 320 16" preserveAspectRatio="none" aria-hidden="true">
        <path id="title-wave" d="M4 9 Q 24 2 44 9 T 84 9 T 124 9 T 164 9 T 204 9 T 244 9 T 284 9 T 314 9"/>
      </svg>
      <p class="home-sub">HUMAN SCORE · 做人成绩单</p>
      <p class="home-lead">做人这些年，是时候量化一下了。损友出题 12 道，维度 7 个，红笔已上膛——看看你这做人的含金量，到底有几斤几两。</p>
      <div class="home-btns">
        <button class="btn btn-primary" id="btn-start">开始打分 ✏️</button>
        <button class="btn btn-ghost" id="btn-how">怎么打分</button>
      </div>
      <p class="home-history" id="home-history"></p>
      <p class="home-disclaimer">* 本测试纯属娱乐，不构成任何评价。</p>
    </div>
  </section>

  <!-- 答题页 -->
  <section id="page-quiz" class="page">
    <div class="quiz-top">
      <span class="q-section" id="q-section">💘 恋爱态度</span>
      <span class="q-count" id="q-count">1 / 12</span>
    </div>
    <div class="q-progress"><i id="q-bar"></i></div>
    <div class="q-card" id="q-card">
      <h2 id="q-text"></h2>
      <div id="q-opts"></div>
      <div class="q-foot">
        <button class="link-btn hidden" id="btn-back-home">← 不考了，回首页</button>
      </div>
    </div>
  </section>

  <!-- 结果页（竖向单幕滚动叙事） -->
  <section id="page-result" class="page">
    <div class="r-sec" id="rs-score"></div>
    <div class="r-sec" id="rs-model"></div>
    <div class="r-sec" id="rs-dims"></div>
    <div class="r-sec" id="rs-comment"></div>
    <div class="r-sec" id="rs-end"></div>
  </section>

</main>

<!-- 批改序幕 -->
<div id="grading">
  <div class="grading-pen" id="grading-pen">🖍️</div>
  <p class="grading-txt">正在批改你的做人试卷…</p>
  <div class="grading-marks" id="grading-marks"></div>
</div>

<!-- toast / 海报模态 / 抽屉 -->
<div id="toast" role="status"></div>
<div class="modal hidden" id="poster-modal">
  <div class="modal-mask" data-close-poster></div>
  <div class="modal-body">
    <p class="modal-tip">长按下方图片，保存你的做人成绩单 📌</p>
    <img id="poster-img" alt="做人成绩单海报">
    <button class="btn btn-ghost" data-close-poster>关闭</button>
  </div>
</div>
<div class="drawer-mask" id="drawer-mask"></div>
<div id="drawer">
  <div class="drawer-body">
    <div class="drawer-head">
      <span class="d-emoji" id="dw-emoji"></span>
      <h4 id="dw-name"></h4>
      <span class="drawer-score" id="dw-score"></span>
    </div>
    <p class="drawer-desc" id="dw-desc"></p>
    <button class="btn btn-primary drawer-close" id="dw-close">明白了</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
/* =====================================================================
 * 「你做人能得几分」单文件应用
 * 结构：工具 → 门禁 → 题库 → 词库/模板 → 抽题计分 → 页面流程 → 结果动画 → 海报
 * ===================================================================== */
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ---------- 动效开关：reduced-motion 或 GSAP 加载失败时自动降级 ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ANIM = !!window.gsap && !REDUCED;
if (ANIM && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

/* ---------- 存储三连降级：sessionStorage → localStorage → 内存 ---------- */
const store=(()=>{
  let mem=new Map(), S=null;
  try{ sessionStorage.setItem('__t','1'); sessionStorage.removeItem('__t'); S=sessionStorage; }
  catch(e){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); S=localStorage; }catch(e2){ S=null; } }
  return {
    get(k){ try{ return S?S.getItem(k):(mem.has(k)?mem.get(k):null);}catch(e){return mem.has(k)?mem.get(k):null;} },
    set(k,v){ try{ if(S){S.setItem(k,v);return;} }catch(e){} mem.set(k,v); },
    remove(k){ try{ if(S){S.removeItem(k);return;} }catch(e){} mem.delete(k); }
  };
})();

/* ---------- crypto 随机工具（洗牌 / 取整） ---------- */
function randInt(n){ // [0, n)
  if(window.crypto && crypto.getRandomValues){
    const lim=Math.floor(0xFFFFFFFF/n)*n, buf=new Uint32Array(1);
    do{ crypto.getRandomValues(buf); }while(buf[0]>=lim);
    return buf[0]%n;
  }
  return Math.floor(Math.random()*n);
}
const pick=arr=>arr[randInt(arr.length)];
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=randInt(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

/* ---------- 低帧率检测：持续 <38fps 时关闭漂浮/粒子 ---------- */
let lowPerf=false, floatTweens=[];
function watchFPS(){
  if(REDUCED) return;
  let n=0,t0=performance.now();
  function loop(now){
    n++;
    const el=now-t0;
    if(el>=2000){
      if(el<5000 && n/(el/1000)<38){ lowPerf=true; stopFloaties(); return; }
      n=0;t0=now;
    }
    if(!lowPerf) requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
function stopFloaties(){ floatTweens.forEach(t=>t.kill()); floatTweens=[]; const f=$('#float-layer'); if(f) f.style.display='none'; }

/* =====================================================================
 * 门禁：4 位数字访问码
 * ★★★ 访问码在这里改（必须 4 位纯数字），支持 ?code=XXXX 自动解锁 ★★★
 * ===================================================================== */
const ACCESS_CODE='2333'; // ←←← 硬编码访问码

const gateEl=$('#gate'), gateCells=$$('#gate-code input'), gateErr=$('#gate-err');
let gateBusy=false;

function gateInputValue(){ return gateCells.map(c=>c.value).join(''); }
function fillGate(v){ v.split('').forEach((ch,i)=>{ if(gateCells[i]) gateCells[i].value=ch; }); }

function tryUnlock(){
  const v=gateInputValue();
  if(v.length<4){ gateErr.textContent='还差 '+(4-v.length)+' 位呢'; return; }
  if(gateBusy) return; gateBusy=true;
  if(v===ACCESS_CODE){
    gateErr.textContent='';
    unlockSuccess();
  }else{
    gateFail();
  }
}
function gateFail(){
  gateErr.textContent='访问码不对，再想想 🤔';
  gateCells.forEach(c=>{c.value='';});
  if(ANIM){
    gsap.fromTo('#gate-card',{x:0},{keyframes:[{x:-11,duration:.07},{x:9,duration:.07},{x:-6,duration:.06},{x:4,duration:.06},{x:0,duration:.06}]});
  }
  gateCells[0].focus();
  gateBusy=false;
}
function unlockSuccess(){
  store.set('hs_unlocked','1'); // 解锁态存档：刷新后直接回首页（而非门禁）
  if(ANIM){
    gsap.to('#lock-shackle',{y:-7,duration:.3,ease:'power2.out'});
    $('.lock-icon').classList.add('ok');
    gsap.to(gateEl,{yPercent:-100,opacity:0,duration:.6,delay:.35,ease:'power2.inOut',onComplete:finishUnlock});
  }else{ finishUnlock(); }
}
function finishUnlock(){
  gateEl.classList.add('off');
  document.body.classList.remove('locked');
  showPage('home'); playHomeIntro();
}
gateCells.forEach((c,i)=>{
  c.addEventListener('input',()=>{
    c.value=c.value.replace(/\D/g,'').slice(-1);
    gateErr.textContent='';
    if(c.value && i<3) gateCells[i+1].focus();
    if(gateInputValue().length===4) setTimeout(tryUnlock,260); // 填满自动校验
  });
  c.addEventListener('keydown',e=>{
    if(e.key==='Backspace' && !c.value && i>0) gateCells[i-1].focus();
    if(e.key==='Enter') tryUnlock();
  });
  c.addEventListener('paste',e=>{
    e.preventDefault();
    const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);
    fillGate(d); (gateCells[Math.min(d.length,3)]||gateCells[3]).focus();
    if(d.length===4) setTimeout(tryUnlock,260);
  });
});
 $('#gate-btn').addEventListener('click',tryUnlock);

/* ---------- 组装题库（场景数×4 题 + 选项旋转防规律） ---------- */
function buildBank(){
  const conv=opts=>opts.map(o=>[o[0],DK[o[1]]]);
  const rot=(a,k)=>{k=((k%4)+4)%4;return a.slice(a.length-k).concat(a.slice(0,a.length-k));};
  const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;};
  const bank=[];
  BASE.forEach(b=>{ // 基准题：题干手写，选项引用对应场景（组合位：场景si<6 × 角度0）
    const sc=(b.p?SC_DAILY:SC_LOVE)[b.si];
    bank.push({text:b.t,opts:rot(conv(sc[1]),hash(b.t)),topic:sc[2],ai:0});
  });
  [[SC_LOVE,ANG_LOVE],[SC_DAILY,ANG_DAILY]].forEach(([pool,angles])=>{
    pool.forEach((sc,si)=>{
      angles.forEach((ang,ai)=>{
        if(si<6&&ai===0) return; // 该组合已被手写基准题占用，跳过避免重复
        const text=sc[0]+ang;
        bank.push({text,opts:rot(conv(sc[1]),hash(text)),topic:sc[2],ai});
      });
    });
  });
  return bank;
}
const BANK=buildBank();
const ALL_IDX=BANK.map((_,i)=>i);

/* =====================================================================
 * 已抽题目索引池（硬性规则1：sessionStorage → localStorage → 内存）

function loadDrawn(){
  try{ const a=JSON.parse(store.get('hs_drawn')||'[]');
    return Array.isArray(a)?a.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  }catch(e){ return []; }
}
function saveDrawn(arr){ store.set('hs_drawn',JSON.stringify(arr)); }
function coversAllDims(idxs){
  const s=new Set();
  idxs.forEach(i=>BANK[i].opts.forEach(o=>s.add(o[1])));
  return DIMS.every(d=>s.has(d.key));
}
/* 抽 12 题：crypto 洗牌 → 剔除已抽池 → 覆盖校验（不满足重抽）；剩余<12 时自动重置池子 */
function drawQuestions(){
  let pool=loadDrawn();
  const basePool=[...pool];
  let remaining=ALL_IDX.filter(i=>!basePool.includes(i));
  if(remaining.length<12){ pool=[]; saveDrawn([]); remaining=[...ALL_IDX]; } // 池子接近抽干 → 重置
  let picks=null;
  for(let a=0;a<300;a++){
    const cand=shuffle([...remaining]).slice(0,12);
    if(coversAllDims(cand)){ picks=cand; break; }
  }
  if(!picks) picks=shuffle([...remaining]).slice(0,12); // 兜底：极小概率
  console.assert(coversAllDims(picks),'[抽题] 本卷 12 题未覆盖全部 7 维度（兜底分支）');
  saveDrawn(pool.concat(picks)); // 抽出即入池：多次测试尽量遇到新题
  return picks.map(i=>BANK[i]);
}

/* =====================================================================
 * 计分（命中型模型） / 称号 / 评语
 * =====================================================================
 * 旧版用 raw ÷ 理论满分 归一化——12 题里某维度通常只出现 5~7 次，
 * 选 1~2 次就被除以满分，分数被结构性压在低位，且人与人拉不开差距。
 * 新版改为“命中率”模型：该维度被选中的次数 ÷ 该维度出现过的题数，
 * 经小样本平滑后映射到 0-100：
 *   · 次次都选（风格一致）→ 90~100，可触发“爆表”
 *   · 偶尔选 → 40~70
 *   · 一次没选 → 干瘪 0
 * 总分 = 最高维度 55% + 次高维度 35% + 七维均值 10%，映射到 150–499：
 * 主攻风格越鲜明，总分越高（典型 300~400，极限 470+），差异感明显。
 * ===================================================================== */
function computeScores(){
  const picks={},chances={},raw={};
  DIMS.forEach(d=>{picks[d.key]=0;chances[d.key]=0;raw[d.key]=0;});
  quiz.questions.forEach((q,qi)=>{
    const seen=new Set();
    q.opts.forEach(o=>{ if(!seen.has(o[1])){seen.add(o[1]);chances[o[1]]++;} }); // 该维度在本卷出现过的题数
    const sel=q.opts[quiz.answers[qi]];
    picks[sel[1]]++;
    raw[sel[1]]+=8+randInt(5); // 每选中一次 +8~+12：折算成 ±2 的手感微调
  });
  const scores={};
  DIMS.forEach(d=>{
    const k=d.key;
    if(picks[k]===0){ scores[k]=0; return; }            // 一次没选：干瘪 0
    const ratio=(picks[k]+0.3)/(chances[k]+0.6);        // 命中率 + 小样本平滑
    const w=raw[k]/picks[k]-10;                          // 随机权重偏差（-2 ~ +2）
    scores[k]=Math.max(0,Math.min(100,Math.round(ratio*100+w)));
  });
  /* 总分：主攻维度定基调，全面程度做微调 → 150–499 */
  const arr=DIMS.map(d=>scores[d.key]).sort((a,b)=>b-a);
  const top=arr[0]/100, second=arr[1]/100;
  const mean=arr.reduce((a,b)=>a+b,0)/(DIMS.length*100);
  const total=Math.max(150,Math.min(499,Math.round(150+(0.55*top+0.35*second+0.10*mean)*349)));
  return {scores,total};
}

/* 称号：按最高 2 个维度从对应词库随机组合，保证复测新鲜感 */
function makeTitle(scores){
  const sorted=[...DIMS].map(d=>({d,s:scores[d.key]}))
    .sort((a,b)=>b.s-a.s||(randInt(2)?1:-1));
  const d1=sorted[0].d,d2=sorted[1].d;
  const mod=pick(d1.mod);
  const tag=pick(randInt(10)<3?d2.tag:d1.tag);
  const id =pick(randInt(10)<4?d2.id :d1.id);
  return {title:`【${mod}${tag}${id}】`,top:[d1.key,d2.key]};
}

/* 评语：按总分段开头 + 最高/最低维度句 + 温暖结尾，[[...]] 为高亮短语 */
function pickDimSentence(dim,score){
  const cm=DIM_MAP[dim].cm;
  return pick(score>=70?cm.hi:score>=30?cm.mid:cm.lo);
}
const plainLen=s=>s.replace(/\[\[|\]\]/g,'').length;
function buildComment(total,scores){
  const sorted=[...DIMS].map(d=>({k:d.key,s:scores[d.key]})).sort((a,b)=>b.s-a.s||(randInt(2)?1:-1));
  const band= total<300?0 : total<380?1 : total<450?2 : 3;
  const open=pick(T_OPEN[band]).replace('{T}',total);
  const sents=[open,
    pickDimSentence(sorted[0].k,sorted[0].s),
    pickDimSentence(sorted[1].k,sorted[1].s),
    pickDimSentence(sorted[6].k,sorted[6].s),
    pickDimSentence(sorted[5].k,sorted[5].s),
    pick(T_CLOSE)];
  let len=plainLen(sents.join(''));
  if(len>250){ sents.splice(4,1); len=plainLen(sents.join('')); }        // 超长：去掉第二低分句
  if(len<150){ sents.splice(3,0,pickDimSentence(sorted[2].k,sorted[2].s)); } // 过短：补第三高分句
  return sents;
}
/* [[高亮]] → tokens */
function parseTpl(s){
  return s.split(/\[\[(.+?)\]\]/).map((t,i)=>({t,hl:i%2===1})).filter(x=>x.t!=='');
}

/* =====================================================================
 * 成绩单海报：Canvas 1080px 宽长图（dpr 绘制 / 移动端高度 ≤4000）
 * ===================================================================== */
function rr(ctx,x,y,w,h,r){ // 圆角矩形（roundRect 降级 quadraticCurveTo）
  r=Math.min(r,w/2,h/2);
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
const measureCanvas=document.createElement('canvas').getContext('2d');
function commentLines(tokens,maxW,size){ // 评语逐字折行估算（高亮用粗体测量）
  const f=`${size}px "PingFang SC","Microsoft YaHei",sans-serif`;
  const fb=`bold ${size}px "PingFang SC","Microsoft YaHei",sans-serif`;
  let lines=1,x=0;
  tokens.forEach(tok=>{
    measureCanvas.font=tok.hl?fb:f;
    for(const ch of tok.t){
      if(ch==='\n'){lines++;x=0;continue;}
      const w=measureCanvas.measureText(ch).width;
      if(x+w>maxW){lines++;x=0;}
      x+=w;
    }
  });
  return lines;
}
function makePosterCanvas(){
  const dpr=Math.min(3,window.devicePixelRatio||1);
  const W=1080,PAD=92,CW=W-PAD*2;
  const hand=`"Kaiti SC","STKaiti","KaiTi","楷体","PingFang SC",serif`;
  const flat=result.comment.map(s=>s+'\n').join(''); // 句末强制换行
  const tokens=parseTpl(flat);
  /* 「写在最后」便签参数（先算行数，才能算总高） */
  const nTokens=FINAL_TOKENS;
  const nSize=27,nLH=46,nX=PAD+24,nW=CW-48,nPadX=42;
  const nLines=commentLines(nTokens,nW-nPadX*2,nSize);
  const boxH=130+nLines*nLH;
  let cSize=30,cLH=54,lines=commentLines(tokens,CW,cSize);
  const est=()=>PAD+120+50+40+56+270+34+86+56+66+DIMS.length*84+52+60
            +lines*cLH+64+66+boxH+112+PAD+40;
  if(est()>3900){ cSize=24;cLH=44;lines=commentLines(tokens,CW,cSize); } // 移动端高度保护
  const H=Math.min(4000,Math.round(est()));
  const cv=document.createElement('canvas');
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  /* 逐字绘制带高亮的文本（返回最后一条基线 y） */
  function drawTokens(toks,x0,y0,maxW,size,lh){
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    let x=x0,y=y0;
    toks.forEach(tok=>{
      ctx.font=(tok.hl?'bold ':'')+size+'px "PingFang SC","Microsoft YaHei",sans-serif';
      for(const ch of tok.t){
        if(ch==='\n'){x=x0;y+=lh;continue;}
        const w=ctx.measureText(ch).width;
        if(x+w>x0+maxW){x=x0;y+=lh;}
        ctx.fillStyle=tok.hl?'#F26D6D':'#2B2B2B'; // 高亮短语红色渲染
        ctx.fillText(ch,x,y);
        x+=w;
      }
    });
    return y;
  }
  /* 纸底 + 点阵纹理 */
  ctx.fillStyle='#FBF8F2'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(43,43,43,.028)';
  for(let y=30;y<H;y+=26) for(let x=(y/26%2)*13;x<W;x+=26){ ctx.fillRect(x,y,1.4,1.4); }
  /* 顶部胶带 */
  ctx.save(); ctx.translate(W/2,44); ctx.rotate(-0.04);
  ctx.fillStyle='rgba(251,231,161,.9)'; rr(ctx,-90,-16,180,32,4); ctx.fill(); ctx.restore();
  /* 标题区 */
  let y=PAD+40;
  ctx.fillStyle='#F26D6D'; ctx.textAlign='center';
  ctx.font=`700 86px ${hand}`; ctx.fillText('做人成绩单',W/2,y);
  y+=48;
  ctx.fillStyle='#7a756c'; ctx.font='26px sans-serif';
  ctx.fillText('HUMAN SCORE · 趣味做人鉴定报告',W/2,y);
  y+=42; ctx.strokeStyle='#e7e0d2'; ctx.setLineDash([10,8]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); ctx.setLineDash([]);
  /* 总分 */
  y+=62; ctx.fillStyle='#F26D6D'; ctx.font=`600 34px ${hand}`; ctx.fillText('— 做 人 总 分 —',W/2,y);
  y+=206; ctx.font=`700 218px ${hand}`; ctx.fillText(String(result.total),W/2,y);
  /* 印章 */
  ctx.save(); ctx.translate(W/2+300,y-190); ctx.rotate(-0.22);
  ctx.strokeStyle='rgba(242,109,109,.9)'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(0,0,86,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=2; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.arc(0,0,72,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(242,109,109,.92)'; ctx.textAlign='center';
  ctx.font=`700 34px ${hand}`; ctx.fillText('做人成绩单',0,-4);
  ctx.font='14px sans-serif'; ctx.fillText('HUMAN SCORE · 已阅',0,26);
  ctx.restore();
  /* 型号 */
  y+=70; ctx.fillStyle='#2B2B2B'; ctx.font=`700 46px ${hand}`;
  ctx.fillText(result.title,W/2,y);
  y+=52; ctx.strokeStyle='#e7e0d2'; ctx.setLineDash([10,8]);
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); ctx.setLineDash([]);
  /* 各维度得分（与页面一致：按分数降序） */
  y+=64; ctx.textAlign='left';
  ctx.fillStyle='#2B2B2B'; ctx.font=`700 40px ${hand}`; ctx.fillText('📊 各维度得分',PAD,y);
  y+=26;
  result.order.forEach(k=>{
    const d=DIM_MAP[k], s=result.scores[k];
    y+=84;
    ctx.font='36px sans-serif'; ctx.fillText(d.emoji,PAD,y-8);
    ctx.fillStyle='#2B2B2B'; ctx.font='600 30px sans-serif'; ctx.fillText(d.name,PAD+50,y-10);
    ctx.fillStyle='#EFE8DA'; rr(ctx,330,y-32,470,24,12); ctx.fill();          // 底槽
    if(s>0){ ctx.fillStyle=s>=90?'#F26D6D':'#8FD6C0';                          // 充能条
      rr(ctx,330,y-32,470*s/100,24,12); ctx.fill(); }
    ctx.fillStyle=s>=90?'#F26D6D':(s===0?'#b9b2a5':'#2B2B2B');
    ctx.textAlign='right'; ctx.font=`700 38px ${hand}`;
    ctx.fillText(s===0?'干瘪 0':(s>=90?s+' 爆表!':String(s)),W-PAD,y-6);
    ctx.textAlign='left';
  });
  /* 损友批注 */
  y+=70; ctx.strokeStyle='#e7e0d2'; ctx.setLineDash([10,8]);
  ctx.beginPath(); ctx.moveTo(PAD,y); ctx.lineTo(W-PAD,y); ctx.stroke(); ctx.setLineDash([]);
  y+=64; ctx.fillStyle='#2B2B2B'; ctx.font=`700 40px ${hand}`; ctx.fillText('🖊️ 损友批注',PAD,y);
  y+=30;
  const endY=drawTokens(tokens,PAD,y,CW,cSize,cLH);
  y=endY+56;
  ctx.textAlign='right'; ctx.fillStyle='#7a756c'; ctx.font='28px sans-serif';
  ctx.fillText('—— 一位嘴毒心软的损友',W-PAD,y);
  /* 写在最后 · 手写便签 */
  y+=66;
  ctx.fillStyle='#FFF7DF'; rr(ctx,nX,y,nW,boxH,18); ctx.fill();
  ctx.strokeStyle='rgba(43,43,43,.07)'; ctx.lineWidth=2; ctx.stroke();
  ctx.save(); ctx.translate(W/2,y); ctx.rotate(-0.035);                       // 薄荷胶带
  ctx.fillStyle='rgba(143,214,192,.72)'; rr(ctx,-56,-14,112,28,4); ctx.fill(); ctx.restore();
  ctx.textAlign='left'; ctx.fillStyle='#3f8a75'; ctx.font=`700 30px ${hand}`;
  ctx.fillText('✉️ 写在最后',nX+nPadX,y+60);
  const noteEnd=drawTokens(nTokens,nX+nPadX,y+108,nW-nPadX*2,nSize,nLH);
  ctx.strokeStyle='rgba(242,109,109,.75)'; ctx.lineWidth=4; ctx.lineCap='round'; // 红笔波浪装饰
  ctx.beginPath(); ctx.moveTo(W/2-100,noteEnd+28);
  ctx.quadraticCurveTo(W/2,noteEnd+16,W/2+100,noteEnd+28); ctx.stroke();
  ctx.font='34px sans-serif'; ctx.fillText('🌱',nX+nW-70,noteEnd+34);
  /* 页脚 */
  y=noteEnd+28+78;
  ctx.textAlign='center'; ctx.fillStyle='#7a756c'; ctx.font='24px sans-serif';
  const d=new Date();
  ctx.fillText(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} · 做人研究所 监制`,W/2,y);
  ctx.fillText('本测试纯属娱乐，不构成任何评价',W/2,y+38);
  return cv;
}
async function savePoster(){
  const btn=$('#btn-save'); if(btn) btn.disabled=true;
  toast('正在生成你的成绩单海报…',1800);
  try{
    const cv=makePosterCanvas();
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const file=new File([blob],'做人成绩单.png',{type:'image/png'});
    const canShare=navigator.canShare&&navigator.canShare({files:[file]});
    if(canShare){
      try{ await navigator.share({files:[file],title:'我的做人成绩单'}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
    }
    const url=URL.createObjectURL(blob);
    if(matchMedia('(pointer:coarse)').matches){ // 移动端兜底：模态内嵌图，长按保存
      $('#poster-img').src=url;
      $('#poster-modal').classList.remove('hidden');
    }else{ // 桌面端直接下载
      const a=document.createElement('a');
      a.href=url; a.download='做人成绩单.png'; a.click();
    }
  }catch(e){ toast('海报生成失败了，再试一次？'); }
  finally{ if(btn) btn.disabled=false; }
}
 $$('#poster-modal [data-close-poster]').forEach(el=>
  el.addEventListener('click',()=>$('#poster-modal').classList.add('hidden')));

/* =====================================================================
 * 抽屉（维度解释，移动端友好） / toast
 * ===================================================================== */
function openDrawer(key){
  const d=DIM_MAP[key], s=result?result.scores[key]:0;
  $('#dw-emoji').textContent=d.emoji;
  $('#dw-name').textContent=d.name;
  $('#dw-score').textContent=s+' 分';
  $('#dw-desc').textContent=d.desc;
  $('#drawer').classList.add('open');
  $('#drawer-mask').classList.add('show');
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer-mask').classList.remove('show'); }
 $('#dw-close').addEventListener('click',closeDrawer);
 $('#drawer-mask').addEventListener('click',closeDrawer);
let toastTimer=null;
function toast(msg,dur=2800){
  const el=$('#toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),dur);
}

/* =====================================================================
 * 初始化：刷新永远回到门禁（未解锁）或首页（已解锁）
 * 不恢复答题进度、不恢复结果页；beforeunload 无任何挽留逻辑
 * ===================================================================== */
(function init(){
  store.remove('hs_progress'); // 兜底清理可能存在的旧进度字段
  watchFPS();
  const unlocked=store.get('hs_unlocked')==='1';
  if(unlocked){
    gateEl.classList.add('off');
    document.body.classList.remove('locked');
    showPage('home'); refreshHomeHistory(); playHomeIntro();
  }else{
    showPage('home'); // 保持结构就绪但 body.locked 使主体不可见不可滚动
    setTimeout(()=>gateCells[0].focus(),200);
    /* 支持 ?code=XXXX 自动填充并解锁 */
    const m=location.search.match(/[?&]code=(\d{4})/);
    if(m){ fillGate(m[1]); setTimeout(tryUnlock,350); }
  }
})();

/* =====================================================================
 * 文件末尾校验：题库 480 题且唯一 / 场景选项组独立 / 7 维全覆盖
 * 称号与评语词库达标 / 门禁码为 4 位纯数字
 * ===================================================================== */
(function runChecks(){
  const SC_TOTAL=SC_LOVE.length+SC_DAILY.length;
  console.assert(SC_TOTAL===120,`[题库] 场景池应为 120，实际 ${SC_TOTAL}`);
  console.assert(BANK.length===SC_TOTAL*4,`[题库] 应恰好 ${SC_TOTAL*4} 题，实际 ${BANK.length}`);
  console.assert(new Set(BANK.map(q=>q.text)).size===BANK.length,'[题库] 存在重复题干');
  const allScenes=[...SC_LOVE,...SC_DAILY];
  const fp=new Set(allScenes.map(s=>s[1].map(o=>o[0]).join('¦')));
  console.assert(fp.size===SC_TOTAL,'[题库] 场景选项组存在重复');
  const dimSet=new Set(); allScenes.forEach(s=>s[1].forEach(o=>dimSet.add(DK[o[1]])));
  console.assert(DIMS.every(d=>dimSet.has(d.key)),'[题库] 7 维度未全覆盖：'+DIMS.filter(d=>!dimSet.has(d.key)).map(d=>d.name).join('、'));
  console.assert(DIMS.every(d=>d.mod.length>=4&&d.tag.length>=4&&d.id.length>=4),'[词库] 称号词库不达标（每库需≥4）');
  console.assert(DIMS.every(d=>d.cm.hi.length>=3&&d.cm.mid.length>=3&&d.cm.lo.length>=3),'[词库] 评语模板不达标（每档需≥3）');
  console.assert(T_OPEN.every(g=>g.length>=3)&&T_CLOSE.length>=4,'[词库] 开头/结尾模板不达标');
  console.assert(FINAL_TOKENS.length>=3&&FINAL_NOTE_TPL.indexOf('[[')>0,'[词库] 「写在最后」结语缺失或无高亮短语');
  console.assert(/^\d{4}$/.test(ACCESS_CODE),`[门禁] 访问码须为 4 位纯数字，当前：${ACCESS_CODE}`);
})();
